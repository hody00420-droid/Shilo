.sh *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
.sh{
  --ink:#181310; --ink70:#4C433A; --ink45:#6E6053; --ink25:#A99C8C;
  --paper:#F4F1EA; --card:#FFFFFF; --line:#DCD3C4; --hair:#EBE5DA;
  --signal:#D2540E; --signal-bg:#FBEBDD; --signal-line:#EFC49B;
  --go:#2C6E49; --go-bg:#E6EFE9;
  --brand:#A2331F;
  --ink-deep:#1A1512;
  /* three radius steps: card, field, tag */
  --r-card:10px; --r:7px; --r-tag:4px;
  --lift:0 1px 2px rgba(24,19,16,.04), 0 10px 24px -12px rgba(24,19,16,.18);
  --lift-sm:0 1px 2px rgba(24,19,16,.05);
  font-family:Heebo,system-ui,sans-serif; color:var(--ink); background:var(--paper);
  font-size:15px; line-height:1.45;
}
.sh .display{font-family:'Secular One',Heebo,sans-serif;font-weight:400;letter-spacing:-.01em;line-height:1.14}
/* numbers only — never wrap Hebrew in this, it reverses word order */
.sh .mono{font-family:'Azeret Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
/* Hebrew gets no letter-spacing: it breaks the join between letters */
.sh .eyebrow{font-size:11px;font-weight:500;color:var(--ink45);letter-spacing:0}

.sh .brand-mark{display:flex;align-items:center;justify-content:center;flex:none;
  width:34px;height:34px;border-radius:var(--r);background:var(--brand);color:#fff;
  font-family:'Secular One',sans-serif;font-size:19px;line-height:1}

.sh .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--lift-sm)}
.sh .card-lift{box-shadow:var(--lift)}
.sh .hair{height:1px;background:var(--hair);border:0}

/* dark surfaces: the client-facing masthead and the login panel */
.sh .dark{background:var(--ink-deep);color:#fff;border-radius:var(--r-card)}
.sh .dark .eyebrow{color:rgba(255,255,255,.55)}
.sh .dark .field{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#fff}
.sh .dark .field::placeholder{color:rgba(255,255,255,.35)}
.sh .dark .field:focus{border-color:rgba(255,255,255,.5);box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.sh .dark .label{color:rgba(255,255,255,.7)}
.sh .dark .btn-line{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.sh .dark .btn-quiet{color:rgba(255,255,255,.6)}

.sh .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 16px;
  font-family:inherit;font-size:14px;font-weight:500;border:1px solid transparent;border-radius:var(--r);
  background:none;color:inherit;cursor:pointer;transition:opacity .12s,transform .06s,box-shadow .12s;white-space:nowrap}
.sh .btn:active{transform:translateY(1px)}
.sh .btn:disabled{opacity:.35;cursor:default;box-shadow:none}
/* ink = the internal system's action. signal = the client's call to act. brand = identity, never a button. */
.sh .btn-solid{background:var(--ink);color:#fff;box-shadow:0 2px 10px -3px rgba(24,19,16,.45)}
.sh .btn-signal{background:var(--signal);color:#fff;box-shadow:0 3px 12px -3px rgba(210,84,14,.55)}
.sh .btn-line{border-color:var(--line);background:var(--card);box-shadow:var(--lift-sm)}
.sh .btn-quiet{color:var(--ink45)}
.sh .btn-sm{height:36px;padding:0 12px;font-size:13px}
.sh .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.sh .field{height:48px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:0 12px;font-family:inherit;font-size:15px;color:var(--ink);transition:border-color .12s,box-shadow .12s}
.sh .field:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(24,19,16,.07)}
.sh .label{display:block;font-size:13px;font-weight:500;color:var(--ink70);margin-bottom:6px}
.sh .note-bad{font-size:13px;color:var(--signal)}

.sh .tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:var(--r-tag);
  font-size:11.5px;font-weight:500;white-space:nowrap}
.sh .tag-ok{background:var(--go-bg);color:var(--go)}
.sh .tag-low{background:var(--signal-bg);color:var(--signal)}
.sh .tag-mute{background:var(--paper);color:var(--ink45)}

.sh .count-dot{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;
  padding:0 5px;margin-inline-start:5px;border-radius:9px;background:var(--brand);color:#fff;
  font-size:11px;font-weight:600}

.sh .toast{display:flex;align-items:center;gap:8px;max-width:420px;padding:12px 16px;border-radius:var(--r);
  background:var(--ink);color:#fff;font-size:13.5px;box-shadow:0 12px 32px -10px rgba(24,19,16,.55)}

/* product thumbnail: hatched swatch, tinted by category */
.sh .thumb{position:relative;flex:none;width:54px;height:54px;border-radius:6px;overflow:hidden;
  border:1px solid var(--line);
  background:repeating-linear-gradient(135deg,var(--tint) 0 5px,transparent 5px 11px),#F7F4EF}
.sh .thumb b{position:absolute;inset-inline-start:4px;bottom:3px;font-family:'Azeret Mono',monospace;
  font-size:9px;font-weight:500;color:var(--ink45);direction:ltr}

/* quantity stepper */
.sh .step{display:flex;align-items:center;height:42px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);overflow:hidden}
.sh .step button{width:38px;height:100%;border:0;background:none;font-size:19px;color:var(--ink);cursor:pointer}
.sh .step button:active{background:var(--paper)}
.sh .step span{min-width:30px;text-align:center;font-weight:600;font-family:'Azeret Mono',monospace}
.sh .step-add{width:42px;height:42px;border:0;border-radius:var(--r);background:var(--ink);color:#fff;
  font-size:20px;line-height:1;cursor:pointer;box-shadow:0 2px 8px -3px rgba(24,19,16,.5)}

/* the availability mark — a day split at midday, morning on the reading side */
.sh .mark{display:flex;width:100%;height:5px;gap:1px}
.sh .mark i{flex:1;background:var(--hair);display:block;border-radius:1px}
.sh .mark i.on{background:var(--ink)}
.sh .mark.off{position:relative;background:none}
.sh .mark.off i{background:var(--signal-bg)}
.sh .mark.off::after{content:'';position:absolute;inset:2px 0;border-top:1px solid var(--signal)}

.sh .tick{width:3px;align-self:stretch;border-radius:2px;flex:none}

/* calendar */
.sh .cal-cell{display:flex;flex-direction:column;align-items:flex-start;padding:6px;min-height:56px;
  border:1px solid var(--hair);border-radius:6px;background:var(--card);color:var(--ink);
  transition:background .1s,border-color .1s;text-align:start}
.sh .cal-cell.busy{background:#FBF8F2;border-color:var(--line)}
.sh .cal-cell.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sh .cal-cell.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sh .cal-cell.past{background:transparent;border-color:transparent;color:var(--ink25)}
